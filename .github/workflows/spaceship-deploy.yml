name: Deploy to Spaceship
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.SPACESHIP_FTP_HOST }}
      FTP_USER: ${{ secrets.SPACESHIP_FTP_USER }}
      FTP_PASS: ${{ secrets.SPACESHIP_FTP_PASS }}
      FTP_DIR: ${{ secrets.SPACESHIP_FTP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload via FTPS (TLS verification on, no delete)
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          DIR="${FTP_DIR:-public_html}"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          mirror -R --verbose --parallel=3 \
            --exclude-glob .git/ --exclude-glob .github/ \
            --exclude .nojekyll --exclude CNAME --exclude README.md \
            ./ "$DIR"
          bye
          LFTP
      - name: Skipped (no secrets)
        if: ${{ env.FTP_HOST == '' || env.FTP_USER == '' || env.FTP_PASS == '' }}
        run: echo "Brak sekretów SPACESHIP_FTP_* - pominięto."
