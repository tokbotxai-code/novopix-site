<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab: ring of projects · NovoPix</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg?v=2">
<style>
:root{--ink:#f6f4ff;--mut:#c9c4ee;--v:#9277ff;--c:#62e0ff;--y:#ffc233;--bg:#0b0a1a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit}.top{position:fixed;z-index:5;left:16px;top:12px;font-size:14px;color:var(--mut)}.top a{color:var(--c)}
.scroll{height:420vh}.stick{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
.stick:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 55%,#2a1f6a88,transparent 70%)}
h1{position:absolute;top:9vh;left:0;right:0;text-align:center;margin:0;font-size:clamp(26px,5vw,52px);padding:0 16px;letter-spacing:-.02em}
h1 span{color:var(--y)}
.stage{perspective:1200px;width:100%;height:56vh;display:grid;place-items:center;position:relative}
.ring{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d}
.p{position:absolute;inset:0;width:var(--w);height:var(--h);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-decoration:none;backface-visibility:visible;border:1px solid #ffffff26;box-shadow:0 10px 40px #0008;background:linear-gradient(150deg,var(--a),var(--b))}
.p b{font-size:22px;line-height:1.1}.p small{font-size:13px;color:#ffffffcc;line-height:1.35}.p i{position:absolute;top:14px;left:18px;font:700 12px/1 Inter,sans-serif;font-style:normal;opacity:.75;letter-spacing:.1em}
.now{position:absolute;right:16px;bottom:16px;font:600 13px/1.3 Inter,sans-serif;letter-spacing:.08em;color:var(--mut);text-align:right}.now b{color:var(--c)}
.hint{position:absolute;left:16px;bottom:16px;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style></head><body>
<div class="top"><a href="./">← Lab</a></div>
<div class="scroll" id="sc"><div class="stick">
<h1>Things we built, <span>on one ring</span></h1>
<div class="stage" id="stage"><div class="ring" id="ring"></div></div>
<div class="hint">Scroll to spin the ring</div>
<div class="now" id="now"></div>
</div></div>
<noscript><p style="padding:24px">This demo needs JavaScript.</p></noscript>
<script>
(function(){
var P=[
["FridgeBite","Recipes from the ingredients you already have","https://fridgebite.novopix.uk/","#ff7a59","#7a2a6a"],
["PantryPal","A simple list of what is in your pantry","https://pantrypal.novopix.uk/","#2ec4b6","#1b3a6b"],
["Website scanner","Speed and accessibility check of a page","https://scanner.novopix.uk/","#62e0ff","#3a2a9a"],
["Fikol","A pixel puzzle game about a little robot","https://fikol.novopix.uk/","#ffc233","#a8421e"],
["Accessibility check","A list of findings, not a certificate","/accessibility-check/","#9277ff","#2a1f6a"],
["Pricing","Public prices in GBP, excluding VAT","/pricing/","#ffc233","#4a2a8a"],
["Templates","Pick a starting point for your site","/templates/","#62e0ff","#1b5a6b"],
["Portfolio","Selected work","/portfolio/","#ff7a59","#3a2a9a"],
["Demo","Want a demo of your idea?","/demo/","#9277ff","#1b3a6b"],
["Care plans","Monthly updates from £29.99, ex VAT","/pricing/","#2ec4b6","#2a1f6a"],
["Studio","Websites and small apps, built to order","/","#ffc233","#7a2a6a"],
["Contact","contact@novopix.uk","/#contact","#62e0ff","#4a2a8a"]];
var phone=matchMedia('(max-width:640px)').matches,N=phone?8:12,W=phone?150:220,H=phone?220:300;
var step=360/N,R=(W/2)/Math.tan(Math.PI/N)+(phone?10:14);
var ring=document.getElementById('ring'),now=document.getElementById('now');
ring.style.setProperty('--w',W+'px');ring.style.setProperty('--h',H+'px');
var items=P.slice(0,N),els=items.map(function(d,i){
 var a=document.createElement('a');a.className='p';a.href=d[2];a.style.setProperty('--a',d[3]);a.style.setProperty('--b',d[4]);
 a.style.transform='rotateY('+(i*step)+'deg) translateZ('+R+'px)';
 a.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i><b>'+d[0]+'</b><small>'+d[1]+'</small>';a.tabIndex=-1;ring.appendChild(a);return a});
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,rot=0,idle=0,last=0;
function frame(t){
 var sc=document.getElementById('sc'),max=sc.offsetHeight-innerHeight;
 var y=Math.max(0,Math.min(max,-sc.getBoundingClientRect().top));
 if(!reduce){idle+=(t-last)*0.004}last=t;
 rot=-(y*(360/Math.max(1,max))*0.97)-idle; // jeden pełny obrót na długość przewijania
 ring.style.transform='translateZ('+(-R)+'px) rotateY('+rot+'deg)';
 var front=0,bestc=-2;
 els.forEach(function(el,i){var ang=(i*step+rot)*Math.PI/180,c=Math.cos(ang);
  el.style.opacity=(0.35+0.65*(c+1)/2).toFixed(3);el.tabIndex=c>0.9?0:-1;if(c>bestc){bestc=c;front=i}});
 now.innerHTML='NOW SHOWING<br><b>'+items[front][0].toUpperCase()+'</b>';
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
