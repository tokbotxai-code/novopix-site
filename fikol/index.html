<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: playful retro arcade, a little robot on a mission
   IDEA: a handheld console — the board is the screen inside a moulded housing
   PICTURE: the live game board itself, characterful vector sprites
   COLOUR and TYPE: deep charcoal-blue metal, coral robot, bright brass screws; Press Start 2P + Inter
   LAYOUT: title strip, board, HUD, d-pad; stacked on phones */
:root{--cell:64px;color-scheme:dark;--bg:#10161f;--case:#1c2532;--edge:#2c3a4d;--ink:#e9eef5;--dim:#8da0b8;--coral:#ff6b4a;--brass:#ffcc3d;--cyan:#56d6e8}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#1a2433,var(--bg));color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:16px 'Press Start 2P',monospace;margin:0;color:var(--coral);letter-spacing:1px}
.btn{white-space:nowrap;font:600 14px Inter,sans-serif;color:var(--ink);background:var(--case);border:1px solid var(--edge);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.case{background:linear-gradient(#222d3c,#18202b);border:1px solid var(--edge);border-radius:22px;padding:10px;box-shadow:0 10px 30px #0008,inset 0 1px 0 #ffffff14}
.screen{position:relative;border-radius:12px;overflow:hidden;background:#0a0f16;aspect-ratio:1;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{display:flex;justify-content:space-between;align-items:center;gap:4px;white-space:nowrap;font:10px 'Press Start 2P',monospace;color:var(--dim);padding:10px 2px 2px}
.hud b{color:var(--brass);font-weight:400}
.pad{flex:1;display:grid;place-items:end center;min-height:0;padding-top:14px}
.dpad{display:grid;grid-template-columns:repeat(3,var(--cell));grid-template-rows:repeat(3,var(--cell));gap:6px}
.dpad button{border:0;border-radius:16px;background:var(--case);color:var(--ink);font-size:24px;box-shadow:0 4px 0 #0a0e14,inset 0 1px 0 #ffffff18;cursor:pointer}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0e14}
#fire{grid-column:2;grid-row:2;background:var(--coral);color:#10161f;font:700 14px Inter,sans-serif}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}
.over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0a0f16e6;text-align:center;padding:14px;overflow-y:auto}
.over>:first-child{margin-top:auto}.over>:last-child{margin-bottom:auto}
.over.show{display:flex}
.over h2{font:15px/1.6 'Press Start 2P',monospace;margin:0;color:var(--brass)}
.over p{margin:0;color:var(--dim);font-size:15px;max-width:30ch}
.levels{display:grid;grid-template-columns:repeat(6,44px);gap:6px}
.levels button{height:46px;border-radius:12px;border:1px solid var(--edge);background:var(--case);color:var(--ink);font:12px 'Press Start 2P',monospace;cursor:pointer}
.levels button:disabled{opacity:.35}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font:12px Inter,sans-serif;color:var(--dim);padding:6px 2px 0}
#undo{min-height:40px;padding:0 12px;font-size:13px}
.sub b{color:var(--ink);font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts .btn{min-height:44px;font-size:13px}
.opts .btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.opts .btn[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
.bip{color:var(--cyan)!important;font-size:14px!important;border-left:3px solid var(--cyan);padding-left:10px;text-align:left}
.stars{color:var(--brass);letter-spacing:2px;font-size:22px}
.levels button small{display:block;font:9px Inter,sans-serif;color:var(--brass);letter-spacing:0;margin-top:2px}
.hint{font-size:13px;color:var(--dim);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.levels button.done{border-color:var(--coral);color:var(--brass)}
.levels button.cur{outline:2px solid var(--cyan);outline-offset:2px}
.dpad button:focus-visible,.levels button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#muteBtn[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
@media(max-width:360px){.btn{padding:0 10px;font-size:13px}h1{font-size:13px}.hud{font-size:8px;letter-spacing:-.5px}.levels{grid-template-columns:repeat(6,40px)}.levels button{height:42px}.top>div{gap:6px!important}}
@media(max-height:760px){:root{--cell:54px}.hint{display:none}}
@media(max-height:620px){:root{--cell:46px}.app{gap:6px;padding-top:6px}.hud{padding-top:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <h1>FIKOL</h1>
    <div style="display:flex;gap:8px">
      <button class="btn" id="muteBtn" aria-label="Wycisz wszystko" aria-pressed="false">♪</button>
      <button class="btn" id="menuBtn">Poziomy</button>
      <button class="btn" id="resetBtn">↺ Od nowa</button>
    </div>
  </div>
  <div class="case">
    <div class="screen" id="screen">
      <canvas id="cv" role="img" aria-label="Plansza gry Fikol. Steruj strzałkami, WASD, padem lub przesunięciem palca."></canvas>
      <div class="over" id="over" role="dialog" aria-label="Okno gry"></div>
    </div>
    <div class="hud"><span>POZ <b id="hLvl">1</b></span><span>ŚRUBKI <b id="hScr">0/0</b></span><span>KLUCZE <b id="hKey">0</b></span><span>AMMO <b id="hAmmo">0</b></span></div>
    <div class="sub"><button class="btn" id="undo" aria-label="Cofnij ruch (Z)">↶ Cofnij</button><span>Ruchy <b id="hMv">0</b></span><span id="hBest">Rekord: –</span></div>
  </div>
  <div class="pad">
    <div class="dpad">
      <button class="u" data-d="0,-1" aria-label="Góra">▲</button>
      <button id="fire" aria-label="PIF, strzał">PIF</button>
      <button class="l" data-d="-1,0" aria-label="Lewo">◀</button>
      <button class="r" data-d="1,0" aria-label="Prawo">▶</button>
      <button class="d" data-d="0,1" aria-label="Dół">▼</button>
    </div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
  <p class="hint">Przesuń palcem albo użyj pada (można przytrzymać). PIF strzela w kierunku ostatniego ruchu. Klawiatura: strzałki lub WASD, spacja strzela, Z cofa ruch, R zaczyna od nowa, Esc to mapa poziomów.</p>
</main>

const NB=new WeakMap();
function noiseBuf(c){let b=NB.get(c);if(!b){b=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=b.getChannelData(0);let q=1;for(let i=0;i<d.length;i++){q=(q*1664525+1013904223)>>>0;d[i]=q/2147483648-1}NB.set(c,b)}return b}
function tone(c,o,t,f,f2,d,type,g,atk){const os=c.createOscillator(),gn=c.createGain();os.type=type||'square';os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+(atk||.005));gn.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(gn);gn.connect(o);os.start(t);os.stop(t+d+.03)}
function noise(c,o,t,d,g,type,f,f2){const s=c.createBufferSource(),fl=c.createBiquadFilter(),gn=c.createGain();s.buffer=noiseBuf(c);fl.type=type||'lowpass';fl.frequency.setValueAtTime(f||1000,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(gn);gn.connect(o);s.start(t);s.stop(t+d+.03)}

// input
let rep=null;const stopRep=()=>{clearInterval(rep);rep=null};
document.querySelectorAll('.dpad button[data-d]').forEach(b=>{const d=b.dataset.d.split(',').map(Number);
  b.addEventListener('pointerdown',e=>{e.preventDefault();stopRep();move(d[0],d[1]);rep=setInterval(()=>move(d[0],d[1]),170)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stopRep));
  b.addEventListener('click',e=>{if(e.detail===0)move(d[0],d[1])})});
addEventListener('blur',stopRep);
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[k];
  if(m){if(state==='play'||state==='menu'||state==='tip'){e.preventDefault()}move(...m);return}
  if(k===' '&&state==='play'){e.preventDefault();fire();return}
  if(k==='r'&&(state==='play'||state==='dead')){load(lvl);return}
  if((k==='z'||k==='Backspace')&&(state==='play'||state==='dead')){e.preventDefault();undo();return}
  if(k==='Escape'){menu()}
});
let sx=0,sy=0,moved=false;const scr=document.getElementById('screen');
scr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});
scr.addEventListener('touchmove',e=>{const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy,cell=scr.clientWidth/W,th=Math.max(26,cell*.8);if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;
  Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy));sx=t.clientX;sy=t.clientY;moved=true},{passive:true});
scr.addEventListener('touchend',e=>{if(moved)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))});

const fb=document.getElementById('fire');fb.addEventListener('pointerdown',e=>{e.preventDefault();fire()});fb.addEventListener('click',e=>{if(e.detail===0)fire()});

const mb=document.getElementById('muteBtn');

mb.onclick=()=>{const off=!set.music&&!set.sfx&&!set.voice;if(off){set.music=true;set.sfx=true}else{set.music=set.sfx=set.voice=false;A.hush()}saveSet();A.ensure();A.music(Math.floor(lvl/4));syncMute();sfx('ui')};syncMute();
const firstGesture=()=>{if(A.ensure()){A.music(Math.floor(lvl/4));if(A.blocked&&A.last&&over.classList.contains('show')){const l=A.last;A.blocked=false;A.speak(l.key,l.text)}}};
['pointerdown','keydown','click','touchend'].forEach(ev=>addEventListener(ev,firstGesture,{passive:true}));
